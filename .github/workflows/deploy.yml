name: Deploy site

on:
  push:
    # main is the live site; the other branches are built as previews under /preview-<branch>/
    branches: [main, hero-im30, hero-im30-fable]
  # Rebuild every morning so past shows drop off the list.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Build branch previews
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_NOINDEX: '1'
        run: |
          for b in hero-im30 hero-im30-fable; do
            if git fetch --depth 1 origin "$b" 2>/dev/null; then
              git worktree add "/tmp/$b" FETCH_HEAD
              (cd "/tmp/$b" && npm ci && BASE_PATH="${{ steps.pages.outputs.base_path }}/preview-$b" npm run build)
              cp -r "/tmp/$b/dist" "dist/preview-$b"
            fi
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
